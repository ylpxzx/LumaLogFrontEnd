<svg width="220" height="62" viewBox="0 0 190 58" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LumaLog logo</title>
  <desc id="desc">A compact contribution heatmap mark with the LumaLog wordmark and Habit Heatmap signature.</desc>

  <style>
    .word {
      fill: #18212f;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .word-accent {
      fill: #16a34a;
    }

    .signature {
      fill: #64748b;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.3px;
    }

    @media (prefers-color-scheme: dark) {
      .word {
        fill: #eef3f8;
      }

      .signature {
        fill: #94a3b8;
      }
    }
  </style>

  <defs>
    <linearGradient id="mark-bg" x1="0" y1="0" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#172033" />
      <stop offset="0.55" stop-color="#101827" />
      <stop offset="1" stop-color="#0b111b" />
    </linearGradient>

    <radialGradient id="mark-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(41.76 13.92) scale(41.76)">
      <stop offset="0" stop-color="#86efac" stop-opacity="0.4" />
      <stop offset="1" stop-color="#86efac" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="streak" x1="12.5" y1="53.1" x2="48" y2="10.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14b8a6" />
      <stop offset="1" stop-color="#bbf7d0" />
    </linearGradient>
  </defs>

  <g>
